name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip odisha-educonnect.zip -d project
          if [ -f project/gradlew ]; then
            mv project/* .
          else
            SUBDIR=$(find project -maxdepth 2 -name "gradlew" -exec dirname {} \; | head -n 1)
            mv "$SUBDIR"/* .
          fi
          chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Odisha-EduConnect-APK
          path: app/build/outputs/apk/debug/*.apk
